services:
  backend:
    image: python:3.9-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "pip install flask && python app.py"
    ports:
      - "5000:5000"

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf   # Mount our config
    ports:
      - "8082:80"
    depends_on:
      - backend

