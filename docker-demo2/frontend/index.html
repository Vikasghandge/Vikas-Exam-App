<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frontend - Docker Compose Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      color: #fff;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #222;
      color: #fff;
      transition: 0.3s;
    }
    button:hover {
      background: #555;
    }
    #result {
      margin-top: 20px;
      font-size: 1.3rem;
      font-weight: bold;
      color: yellow;
    }
  </style>
</head>
<body>
  <h1>🚀 Docker Compose Demo</h1>
  <p>This frontend will fetch a message from the backend.</p>

  <button onclick="callBackend()">Call Backend</button>

  <div id="result"></div>

<script>
  async function callBackend() {
    try {
      // just call /api/data (no full URL, no port)
      const response = await fetch("/api/data");
      const data = await response.json();
      document.getElementById("result").innerText = "Backend says: " + data.message;
    } catch (error) {
      document.getElementById("result").innerText = "❌ Could not reach backend!";
    }
  }
</script>
